    <!-- Restore React Router paths after a GitHub Pages 404 redirect -->
    <script>
      try {
        const redirectUrl = sessionStorage.getItem(
          'jugin-portfolio-redirect',
        )

        if (redirectUrl) {
          sessionStorage.removeItem(
            'jugin-portfolio-redirect',
          )

          const url = new URL(redirectUrl)

          window.history.replaceState(
            null,
            '',
            `${url.pathname}${url.search}${url.hash}`,
          )
        }
      } catch {
        // The website can still load if sessionStorage is unavailable.
      }
    </script>
