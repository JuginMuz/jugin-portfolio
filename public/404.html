<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="robots" content="noindex" />

    <title>Redirecting…</title>

    <script>
      try {
        sessionStorage.setItem(
          'jugin-portfolio-redirect',
          window.location.href,
        )
      } catch {
        // Continue to the homepage if storage is unavailable.
      }

      window.location.replace('/jugin-portfolio/')
    </script>
  </head>

  <body>
    <p>Redirecting to the portfolio…</p>
  </body>
</html>
